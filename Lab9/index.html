
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список пользователей</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Список пользователей</h1>
        <p class="description">
            Получение имён и электронных адресов пользователей с сервера.
        </p>

        <div class="controls">
            <button id="loadBtn" type="button">
                Загрузить пользователей
            </button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">
            Нажмите кнопку для загрузки данных.
        </p>

        <section aria-labelledby="usersHeading">
            <h2 id="usersHeading">Пользователи</h2>
            <ul id="usersList" class="users-list"></ul>
        </section>
    </main>
</body>
</html>
